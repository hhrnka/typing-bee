<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Typing Bee is a fun typing speed test game to improve your skills and track your WPM and accuracy. Choose difficulty levels and share your score!">
    <title>Typing Bee - Test</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html">
                <img src="emojis.com bee.png" alt="Typing Bee Logo" class="logo">
            </a>
        </div>
    </header>

    <div class="container">

    <h1>Typing Test</h1>

    <label for="difficulty">Choose your level of difficulty:</label>
    <select name="difficulty" id="difficulty">
        <option value="easy">🐣 Easy</option>
        <option value="medium">🐝 Medium</option>
        <option value="hard">🔥 Hard</option>
    </select>

    <div id="display-paragraph" class="paragraph-box"></div>

    <textarea name="textarea" id="typing-area" placeholder="Start typing here ..."></textarea>

    <div class="stats">
        <p><strong>Time left:</strong>  <span id="timer">60</span>seconds</p>
        <p><strong>Words per minute:</strong> <span id="wpm">0</span></p>
        <p><strong>Accuracy:</strong> <span id="accuracy">100%</span></p>
    </div>

    <button class="start-button" onclick="startTest()">Restart Test</button>

    </div>
    
    <footer class="main-footer">
        <div class="social-links">
            <a href="https://www.instagram.com/" target="_blank">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://www.tiktok.com/explore" target="_blank">
                <i class="fa-brands fa-tiktok"></i>
            </a>
            <a href="https://www.facebook.com/" target="_blank">
                <i class="fa-brands fa-facebook"></i>
            </a>
        </div>
        <p>© 2025 Typing Bee 🐝 — All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
